name: relevo

x-backend: &backend
  image: relevo-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  environment: &backend-environment
    RELEVO_DATABASE_URL: postgresql+psycopg://relevo:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@postgres:5432/relevo
    RELEVO_API_TOKEN: ${RELEVO_API_TOKEN:?Run python scripts/configure.py}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: relevo
      POSTGRES_DB: relevo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevo -d relevo"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *backend
    environment:
      RELEVO_API_URL: http://api:8000
      RELEVO_METRICS_PORT: "8001"
      RELEVO_WORKER_MONITOR_SECONDS: ${RELEVO_WORKER_MONITOR_SECONDS:-0.05}
      RELEVO_API_TOKEN: ${RELEVO_API_TOKEN:?Run python scripts/configure.py}
    command: ["python", "-m", "relevo.worker"]
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  scheduler:
    <<: *backend
    environment:
      <<: *backend-environment
      RELEVO_METRICS_PORT: "8002"
    command: ["python", "-m", "relevo.scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 10s
    restart: unless-stopped

  postgres-test:
    profiles: ["test"]
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: relevo
      POSTGRES_DB: relevo_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevo -d relevo_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      RELEVO_TEST_DATABASE_URL: postgresql+psycopg://relevo:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@postgres-test:5432/relevo_test
      RELEVO_TOXIPROXY_URL: http://toxiproxy:8474
      RELEVO_PROXY_API_URL: http://toxiproxy:15480
      RELEVO_PROXY_DATABASE_URL: postgresql+psycopg://relevo:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@toxiproxy:15433/relevo_test
    depends_on:
      postgres-test:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      fault-api:
        condition: service_started

  toxiproxy:
    profiles: ["test"]
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    command: ["-host=0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:15480:15480"
      - "127.0.0.1:15433:15433"
    environment:
      LOG_LEVEL: error

  fault-api:
    <<: *backend
    profiles: ["test"]
    environment:
      RELEVO_DATABASE_URL: postgresql+psycopg://relevo:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@postgres-test:5432/relevo_test
      RELEVO_API_TOKEN: test-only-token-never-use-outside-tests-12345
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-benchmark:
    profiles: ["benchmark"]
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: relevo
      POSTGRES_DB: relevo_benchmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - benchmark_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relevo -d relevo_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 20

  benchmark-migrate:
    <<: *backend
    profiles: ["benchmark"]
    environment: &benchmark-environment
      RELEVO_DATABASE_URL: postgresql+psycopg://relevo:${POSTGRES_PASSWORD:?Run python scripts/configure.py}@postgres-benchmark:5432/relevo_benchmark
      RELEVO_API_TOKEN: ${RELEVO_API_TOKEN:?Run python scripts/configure.py}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres-benchmark:
        condition: service_healthy

  benchmark-api:
    <<: *backend
    profiles: ["benchmark"]
    environment: *benchmark-environment
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      benchmark-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 2s
      timeout: 3s
      retries: 20

  benchmark-worker:
    <<: *backend
    profiles: ["benchmark"]
    environment:
      RELEVO_API_URL: http://benchmark-api:8000
      RELEVO_API_TOKEN: ${RELEVO_API_TOKEN:?Run python scripts/configure.py}
      RELEVO_METRICS_PORT: "8001"
      RELEVO_WORKER_MONITOR_SECONDS: ${RELEVO_BENCHMARK_MONITOR_SECONDS:-0.05}
    command: ["python", "-m", "relevo.worker"]
    depends_on:
      benchmark-api:
        condition: service_healthy
    init: true
    stop_grace_period: 10s

  benchmark-scheduler:
    <<: *backend
    profiles: ["benchmark"]
    environment: *benchmark-environment
    command: ["python", "-m", "relevo.scheduler"]
    depends_on:
      benchmark-migrate:
        condition: service_completed_successfully
    init: true

volumes:
  postgres_data:
  benchmark_data:
