name: Frontend checks
on:
  push:
    paths: ['frontend/**', 'vercel.json', 'package.json', 'llms.txt', '*.md', 'docs/**', 'benchmarks/**', 'artifacts/replays/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'vercel.json', 'package.json', 'llms.txt', '*.md', 'docs/**', 'benchmarks/**', 'artifacts/replays/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-checks
          path: |
            artifacts/verification/release-browser.json
            artifacts/verification/release-desktop-accessibility.json
            artifacts/verification/release-responsive-accessibility.json
            frontend/test-results/
