name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          working-directory: backend
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --project backend --locked
      - name: Lint
        run: uv run --project backend --no-sync ruff check backend scripts
      - name: Check formatting
        run: uv run --project backend --no-sync ruff format --check backend scripts
      - name: Generate private ephemeral test credentials
        run: python scripts/configure.py
      - name: Unit, PostgreSQL, and TCP fault tests
        run: docker compose --profile test run --build --rm tests pytest --cov=relevo --cov-report=term-missing
      - name: Stop isolated test services
        if: always()
        run: docker compose --profile test down
